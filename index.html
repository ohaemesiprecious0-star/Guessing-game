<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <title>Guess My Number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>

        <button type="button" class="btn Again">Again!</button> 
        <h1>Guess My Number!</h1>
        <p class="between"> (Between 1 and 20) </p>

        <div class="number">?</div>


    </header>

    <main>
        <section class="left">
            <input type="number" class="guess">
            <button class="btn check">check!</button>
        </section>

        <section class="right">
            <p class="message">start guessing....</p>
            <p class="label-score">score: <span class="score">20</span></p>
            <p class="label-highscore">Highscore: <span class="highscore">0</span></p>
        </section>
    </main>









    <script src="script.js"></script>
</body>

</html>
